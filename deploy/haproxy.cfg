global
  log stdout format raw local0

defaults
  log global
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend dbweb
  bind *:8080
  default_backend dbweb_api

backend dbweb_api
  balance roundrobin
  option httpchk GET /api/health/ready
  http-check expect status 200
  server api-1 api-1:3000 check inter 2s fall 2 rise 2
  server api-2 api-2:3000 check inter 2s fall 2 rise 2
  server api-3 api-3:3000 check inter 2s fall 2 rise 2
