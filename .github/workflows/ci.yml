name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag dbweb:ci .

  ha-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dbweb
          POSTGRES_USER: dbweb
          POSTGRES_PASSWORD: dbweb-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbweb -d dbweb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO
        run: >-
          docker run --detach --name dbweb-minio --publish 9000:9000
          --env MINIO_ROOT_USER=dbweb-minio
          --env MINIO_ROOT_PASSWORD=dbweb-minio-secret
          minio/minio:RELEASE.2025-10-15T17-29-55Z server /data
      - name: Wait for MinIO
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs dbweb-minio
          exit 1
      - run: pnpm exec vitest run apps/api/src/ha/ha.integration.test.ts --reporter=verbose
        env:
          DBWEB_HA_INTEGRATION: 1
          DBWEB_HA_POSTGRES_URL: postgres://dbweb:dbweb-test-password@127.0.0.1:5432/dbweb
          DBWEB_HA_REDIS_URL: redis://127.0.0.1:6379
          DBWEB_HA_S3_ENDPOINT: http://127.0.0.1:9000
          DBWEB_HA_S3_BUCKET: dbweb-ha-integration
          DBWEB_HA_S3_ACCESS_KEY_ID: dbweb-minio
          DBWEB_HA_S3_SECRET_ACCESS_KEY: dbweb-minio-secret

  postgres-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ['9.6', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: dbweb
          POSTGRES_USER: dbweb
          POSTGRES_PASSWORD: dbweb-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbweb -d dbweb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/api/src/data/data-mutation.integration.test.ts apps/api/src/ddl/ddl.integration.test.ts apps/api/src/accounts/native-account.integration.test.ts apps/api/src/transfers/exact-transfer.integration.test.ts
        env:
          DBWEB_INTEGRATION_ENGINE: postgres
          DBWEB_INTEGRATION_HOST: 127.0.0.1
          DBWEB_INTEGRATION_PORT: 5432
          DBWEB_INTEGRATION_DATABASE: dbweb
          DBWEB_INTEGRATION_USERNAME: dbweb
          DBWEB_INTEGRATION_PASSWORD: dbweb-test-password
      - run: pnpm exec vitest run apps/api/src/transfers/sql-dump.integration.test.ts
        env:
          DBWEB_INTEGRATION_ENGINE: postgres
          DBWEB_INTEGRATION_HOST: 127.0.0.1
          DBWEB_INTEGRATION_PORT: 5432
          DBWEB_INTEGRATION_DATABASE: dbweb
          DBWEB_INTEGRATION_USERNAME: dbweb
          DBWEB_INTEGRATION_PASSWORD: dbweb-test-password

  mysql-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ['5.6', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_DATABASE: dbweb
          MYSQL_USER: dbweb
          MYSQL_PASSWORD: dbweb-test-password
          MYSQL_ROOT_PASSWORD: dbweb-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -udbweb -pdbweb-test-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure nonadministrative integration privileges
        run: >-
          pnpm --filter @dbweb/api exec node --input-type=module -e
          "import mysql from 'mysql2/promise';
          const connection = await mysql.createConnection({ host: '127.0.0.1', port: 3306, user: 'root', password: 'dbweb-root-password' });
          await connection.query('SET GLOBAL log_bin_trust_function_creators = 1');
          await connection.query(\"GRANT CREATE USER ON *.* TO 'dbweb'@'%' WITH GRANT OPTION\");
          await connection.query(\"GRANT SELECT ON mysql.user TO 'dbweb'@'%'\");
          await connection.query(\"GRANT SELECT ON mysql.db TO 'dbweb'@'%'\");
          await connection.query(\"GRANT SELECT ON mysql.tables_priv TO 'dbweb'@'%'\");
          await connection.query(\"GRANT UPDATE ON mysql.* TO 'dbweb'@'%'\");
          await connection.end();"
      - run: pnpm exec vitest run apps/api/src/data/data-mutation.integration.test.ts apps/api/src/ddl/ddl.integration.test.ts apps/api/src/accounts/native-account.integration.test.ts apps/api/src/transfers/exact-transfer.integration.test.ts
        env:
          DBWEB_INTEGRATION_ENGINE: mysql
          DBWEB_INTEGRATION_HOST: 127.0.0.1
          DBWEB_INTEGRATION_PORT: 3306
          DBWEB_INTEGRATION_DATABASE: dbweb
          DBWEB_INTEGRATION_USERNAME: dbweb
          DBWEB_INTEGRATION_PASSWORD: dbweb-test-password
          DBWEB_INTEGRATION_ADMIN_PASSWORD: dbweb-root-password
      - run: pnpm exec vitest run apps/api/src/transfers/sql-dump.integration.test.ts
        env:
          DBWEB_INTEGRATION_ENGINE: mysql
          DBWEB_INTEGRATION_HOST: 127.0.0.1
          DBWEB_INTEGRATION_PORT: 3306
          DBWEB_INTEGRATION_DATABASE: dbweb
          DBWEB_INTEGRATION_USERNAME: dbweb
          DBWEB_INTEGRATION_PASSWORD: dbweb-test-password
          DBWEB_INTEGRATION_ADMIN_PASSWORD: dbweb-root-password
